name: (reusable) tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      # we configure postgres specifically for the same configuration
      # we have for testing locally.
      postgres:
        image: postgres:16.1
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: explorer
        ports:
          - 15432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu or self-hosted)
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "Install dependencies"
        run: make deps && go get .

      - name: "Compile"
        run: make build-production

      - name: "Run linters"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout 3m --verbose --build-tags production

      - name: "Run tests"
        run: make test
